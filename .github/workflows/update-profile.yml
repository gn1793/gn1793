name: Update Profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]
    paths:
      - 'data/*.yaml'
      - 'scripts/**'
      - 'README.template.md'
      - 'assets/**'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: gn1793-profile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate metadata
        run: python scripts/validate_data.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Fetch public activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_activity.py
      - name: Fetch public GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_stats.py
      - name: Render dynamic GitHub Stats card
        run: python scripts/render_stats.py
      - name: Render README
        run: python scripts/build_readme.py
      - name: Commit generated profile only when modified
        run: |
          git add README.md assets/github-stats.svg assets/cards/
          if git diff --cached --quiet; then
            echo 'README unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh profile [skip ci]'
          git push
